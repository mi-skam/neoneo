name: release

# Push a tag v<VERSION> (VERSION in neoneo.py) to publish a GitHub release
# with neoneo-<VERSION>.zip. Pull requests and pushes run the tests only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches VERSION
        run: test "$GITHUB_REF_NAME" = "v$(python3 neoneo.py version)"
      - run: make dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 neoneo.py version)
          gh release create "$GITHUB_REF_NAME" "build/neoneo-$version.zip" \
            --title "neoneo $version" --generate-notes
